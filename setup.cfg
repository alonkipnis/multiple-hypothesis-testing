[metadata]
name = multiple-hypothesis-testing
version= 0.2.2
author = Alon Kipnis
author_email = alonkipnis@gmail.com
description = Several methods of combining P-values
long_description = file: README.md
long_description_content_type = text/markdown
url=https://github.com/alonkipnis/multiple-hypothesis-testing
download_url=https://github.com/alonkipnis/multiple-hypothesis-testing
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    numpy >= 1.6
    matplotlib >= 3.6

[options.packages.find]
where = src
exclude =
    tests
